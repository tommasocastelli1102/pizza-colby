databases:
  - name: pizza-colby-db
    plan: free

services:
  - type: web
    name: pizza-colby-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pizza-colby-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true

  - type: web
    name: pizza-colby-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Hardcoded rather than fromService: Render's fromService "host" property
    # returns the private-networking hostname (unresolvable from a browser),
    # and "url" isn't supported for type: web. Update this if the API
    # service is ever renamed.
    envVars:
      - key: VITE_API_URL
        value: https://pizza-colby-api.onrender.com
