services:
  - type: web
    name: pizza-colby-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: web
    name: pizza-colby-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Hardcoded rather than fromService: Render's fromService "host" property
    # returns the private-networking hostname (unresolvable from a browser),
    # and "url" isn't supported for type: web. Update this if the API
    # service is ever renamed.
    envVars:
      - key: VITE_API_URL
        value: https://pizza-colby-api.onrender.com
